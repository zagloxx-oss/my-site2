name: Build Android Native Library

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную, кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          # Можно указать любую версию NDK. r26b — стабильная и свежая.
          ndk-version: r26b

      - name: Install Ninja
        run: sudo apt-get install ninja-build -y

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build library
        run: cmake --build build

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: build/*.so
